<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b245f">
  <meta name="description" content="Send an admission enquiry to Joshitha School.">
  <title>Enquiry Form | Joshitha School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;500;600;700&family=Tilt+Warp&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
  <link href="site.css" rel="stylesheet">
</head>
<body data-page="enquiry-form">
  <div id="site-shell"></div>
<main id="site-content" class="container">
  <section class="page-view" aria-labelledby="page-title">
    <div class="page-heading"><h2 id="page-title">Enquiry Form</h2></div>
    <div class="content-flow">
      <div class="enquiry-layout">
        <aside class="enquiry-note"><h3>Let’s start a conversation.</h3><p>Send us a note about your child and our school team will be in touch.</p><p class="mb-0"><i class="fa-solid fa-phone me-2" aria-hidden="true"></i><a href="tel:9989422020">9989422020</a></p></aside>
        <form action="mailto:info@joshithaschool.com" method="post" enctype="text/plain" class="row g-3">
          <div class="col-sm-6"><label class="form-label" for="student-name">Student Name</label><input class="form-control" type="text" id="student-name" name="Student Name" required></div>
          <div class="col-sm-6"><label class="form-label" for="father-name">Father Name</label><input class="form-control" type="text" id="father-name" name="Father Name" required></div>
          <div class="col-sm-6"><label class="form-label" for="contact-number">Contact Number</label><input class="form-control" type="tel" id="contact-number" name="Contact Number" required></div>
          <div class="col-sm-6"><label class="form-label" for="date-of-birth">Date of birth</label><input class="form-control" type="date" id="date-of-birth" name="Date of birth"></div>
          <div class="col-sm-6"><label class="form-label" for="class">Class</label><input class="form-control" type="text" id="class" name="Class" required></div>
          <div class="col-12"><label class="form-label" for="comments">Comments</label><textarea class="form-control" id="comments" name="Comments" rows="4"></textarea></div>
          <div class="col-12"><button class="btn btn-school" type="submit">Send enquiry <i class="fa-regular fa-paper-plane ms-2" aria-hidden="true"></i></button><p class="small text-secondary mt-2 mb-0">Your email application will open with your enquiry details ready to send.</p></div>
        </form>
      </div>
    </div>
  </section>
</main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="site-shell.js"></script>
</body>
</html>
