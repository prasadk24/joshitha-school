<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b245f">
  <meta name="description" content="Photos and highlights from Joshitha School.">
  <title>Gallery | Joshitha School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;500;600;700&family=Tilt+Warp&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="site.css" rel="stylesheet">
</head>
<body data-page="gallery">
  <div id="site-shell"></div>
<main id="site-content" class="container">
  <section class="page-view" aria-labelledby="page-title">
    <div class="page-heading"><h2 id="page-title">Gallery</h2></div>
    <div class="content-flow">
      <hr class="page-break">
      <div class="gallery-grid">
        <figure class="gallery-card"><img src="images/carousal/acrons.jpg" alt="Grade X results" loading="lazy"><figcaption>Grade X results</figcaption></figure>
        <figure class="gallery-card"><img src="images/carousal/school-toppers.jpg" alt="School toppers" loading="lazy"><figcaption>School toppers</figcaption></figure>
        <figure class="gallery-card"><img src="images/carousal/subject-wise.jpg" alt="Subject-wise results" loading="lazy"><figcaption>Subject-wise results</figcaption></figure>
        <figure class="gallery-card"><img src="images/carousal/xth-all-students.jpg" alt="Grade X students" loading="lazy"><figcaption>Grade X students</figcaption></figure>
        <figure class="gallery-card"><img src="images/teaching/digital-classroom.jpg" alt="Digital classroom" loading="lazy"><figcaption>Digital classroom</figcaption></figure>
        <figure class="gallery-card"><img src="images/teaching/science-lab.jpg" alt="Science lab" loading="lazy"><figcaption>Science lab</figcaption></figure>
        <figure class="gallery-card"><img src="images/teaching/school-library.jpg" alt="School library" loading="lazy"><figcaption>School library</figcaption></figure>
        <figure class="gallery-card"><img src="images/teaching/dance.jpg" alt="Dance and music" loading="lazy"><figcaption>Dance and music</figcaption></figure>
      </div>
    </div>
  </section>
</main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</html>
